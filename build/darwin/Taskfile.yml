version: '3'

includes:
  common: ../Taskfile.yml

vars:
  WAILS_PATCHED_DIR: .cache/wails-v3.0.0-beta.6-macos27
  WAILS_PATCHED_MODFILE: .cache/codeswitch-wails-macos27.mod

tasks:
  prepare:wails:macos27:
    summary: Applies the upstream macOS 27 system tray patch to Wails beta.6
    internal: true
    sources:
      - go.mod
      - go.sum
      - build/darwin/Taskfile.yml
      - build/darwin/wails-macos27-systemtray.patch
    generates:
      - '{{.WAILS_PATCHED_DIR}}/pkg/application/systemtray_darwin.h'
      - '{{.WAILS_PATCHED_DIR}}/pkg/application/systemtray_darwin.m'
      - '{{.WAILS_PATCHED_MODFILE}}'
      - .cache/codeswitch-wails-macos27.sum
    cmds:
      - |
        go mod download github.com/wailsapp/wails/v3@v3.0.0-beta.6
        WAILS_SOURCE="$(go env GOMODCACHE)/github.com/wailsapp/wails/v3@v3.0.0-beta.6"
        test -d "$WAILS_SOURCE"
        mkdir -p "{{.WAILS_PATCHED_DIR}}"
        chmod -R u+w "{{.WAILS_PATCHED_DIR}}"
        cp -R "$WAILS_SOURCE/." "{{.WAILS_PATCHED_DIR}}"
        chmod -R u+w "{{.WAILS_PATCHED_DIR}}"
        patch --batch --forward -d "{{.WAILS_PATCHED_DIR}}" -p1 -i "$(pwd)/build/darwin/wails-macos27-systemtray.patch"
        cp go.mod "{{.WAILS_PATCHED_MODFILE}}"
        cp go.sum .cache/codeswitch-wails-macos27.sum
        go mod edit -modfile="{{.WAILS_PATCHED_MODFILE}}" -replace=github.com/wailsapp/wails/v3=./.cache/wails-v3.0.0-beta.6-macos27

  build:
    summary: Creates a production build of the application
    deps:
      - task: prepare:wails:macos27
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          PRODUCTION:
            ref: .PRODUCTION
      - task: common:generate:icons
    cmds:
      - go build -modfile={{.WAILS_PATCHED_MODFILE}} {{.BUILD_FLAGS}} -o {{.OUTPUT}}
    vars:
      BUILD_FLAGS: '{{if eq .PRODUCTION "true"}}-tags production -trimpath -buildvcs=false -ldflags="-w -s"{{else}}-buildvcs=false -gcflags=all="-l"{{end}}'
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
    env:
      GOOS: darwin
      CGO_ENABLED: 1
      GOARCH: '{{.ARCH | default ARCH}}'
      CGO_CFLAGS: "-mmacosx-version-min=12.0"
      CGO_LDFLAGS: "-mmacosx-version-min=12.0"
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      PRODUCTION: '{{.PRODUCTION | default "false"}}'

  build:universal:
    summary: Builds darwin universal binary (arm64 + amd64)
    deps:
      - task: build
        vars:
          ARCH: amd64
          OUTPUT: "{{.BIN_DIR}}/{{.APP_NAME}}-amd64"
      - task: build
        vars:
          ARCH: arm64
          OUTPUT: "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"
    cmds:
      - lipo -create -output "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"
      - rm "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"

  package:
    summary: Packages a production build of the application into a `.app` bundle
    deps:
      - task: build
        vars:
          PRODUCTION: "true"
    cmds:
      - task: create:app:bundle

  package:universal:
    summary: Packages darwin universal binary (arm64 + amd64)
    deps:
      - task: build:universal
    cmds:
      - task: create:app:bundle


  create:app:bundle:
    summary: Creates an `.app` bundle
    cmds:
      - mkdir -p {{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/{MacOS,Resources}
      - cp build/darwin/icons.icns {{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources
      - cp {{.BIN_DIR}}/{{.APP_NAME}} {{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/MacOS
      - cp build/darwin/Info.plist {{.BIN_DIR}}/{{.APP_NAME}}.app/Contents
      - codesign --force --deep --sign - {{.BIN_DIR}}/{{.APP_NAME}}.app

  run:
    cmds:
      - mkdir -p {{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/{MacOS,Resources}
      - cp build/darwin/icons.icns {{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/Resources
      - cp {{.BIN_DIR}}/{{.APP_NAME}} {{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/MacOS
      - cp build/darwin/Info.dev.plist {{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/Info.plist
      - codesign --force --deep --sign - {{.BIN_DIR}}/{{.APP_NAME}}.dev.app
      - '{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/MacOS/{{.APP_NAME}}'
